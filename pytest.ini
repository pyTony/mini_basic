[pytest]
# Phase markers — regression for phase N includes all lower phases (see conftest).
#
# Commands:
#   python -m pytest -q -m "phase0 and not slow" --timeout=45   # implemented baseline
#   python -m pytest -q -m "phase1 and not slow" --timeout=45   # phase0 + phase1
#   python -m pytest -q -m "phase2 and not slow" --timeout=60   # phase0..2 (when marked)
#
# conftest expands markexpr:
#   phase1 and not slow  ->  (phase0 or phase1) and not slow
#
# phase0 — implemented language / BBC features (broad, stable):
#   test_mini_basic.py, test_parsing.py, test_hanoi_vdu_wrap.py,
#   test_bbc_modes.py, test_bbc_chained_strings.py, test_dim_memory.py,
#   test_save_case.py, test_feature_matrices.py, test_poem_load.py,
#   test_dialect_hint.py, test_m6502_cport_mits.py (mits + m6502_cport)
#
# phase1 — focused foundation (control flow, composition, VDU A–C, session,
#   detokenize, glued BBC, piechart glue):
#   test_control_flow.py, test_compositional.py, test_piechart_regression.py,
#   test_vdu_phase_a.py, test_vdu_phase_bc.py, test_session_display.py,
#   test_bbc_detokenize.py, test_glued_bbc_syntax.py
#
# phase2 — leftover window / visual isolation only:
#   test_graphics_confirm.py, test_display.py, test_pygame_input_events.py
# OK programs (animal, clock XOR, squares, welcome, hanoi, dialect text)
# stay in phase0/phase1 so untagged and -m phase1 both run them.
#
# Other:
#   python -m pytest -q test/test_mini_basic.py --timeout=30
#
# stuck_tests.txt documents hangers; prefer markers + -k over a separate runner.

testpaths = test
# Note: setting norecursedirs replaces pytest defaults — keep .hypothesis / venv / etc.
norecursedirs =
    .*
    .git
    .hypothesis
    scripts
    examples
    backup
    dist
    dist_archive
    basics
    documentation
    lib
    venv
    .venv
    build
    *.egg

markers =
    phase0: implemented baseline (language, parsing, hanoi wrap, modes, matrices, …)
    phase1: focused foundation (control flow, VDU text-mode, detokenize, session); includes phase0 when used as -m phase1
    phase2: graphics and advanced isolation; includes phase0+phase1 when used as -m phase2
    non_gfx: pure execution / text / no display side effects
    graphics: involves pygame, display, pixel checks, or MODE window demos
    slow: long-running, corpus, interactive, or known hangers
    mits: MITS / classic MS-era dialect coverage
    m6502_cport: Microsoft BASIC M6502 C-port examples (examples/m6502-cport)
    bbc: BBC-family dialect coverage
    mini: mini dialect coverage

# Ignore local-agent tests: they import gitignored utils.* modules.
addopts =
    -ra
    --strict-markers
    --ignore=test/test_agent_resource.py
    --ignore=test/test_user_approval.py
    --ignore=test/verify_user_approval.py

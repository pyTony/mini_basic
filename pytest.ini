[pytest]
# Phase markers for mini_basic test reorganization (Phase 1 / Phase 2 split)
# Usage examples:
#   python -m pytest -q -m "phase1 and not slow"
#   python -m pytest -q -m "phase2 or graphics"
#   python test/run_regression.py   (respects stuck + can be extended for markers)

markers =
    phase1: solid non-graphics foundation (control flow, PROC, composition, file I/O, errors)
    phase2: graphics and advanced BBC feature work (requires isolation / mocks)
    non_gfx: pure execution / text / no display side effects
    graphics: involves pygame, display, VDU, pixel checks, or MODE
    slow: long-running, corpus, or interactive (prefer stuck_tests.txt + run_regression)

addopts = -ra --strict-markers

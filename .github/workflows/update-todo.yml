name: Update TODO.md

on:
  pull_request:
    types: [closed]
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: write
  issues: read
  pull-requests: read

jobs:
  update-todo:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Regenerate TODO.md from open issues and recent PRs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          {
            echo "# TODO"
            echo
            echo "Auto-generated from open GitHub issues and recently merged PRs. Do not"
            echo "edit by hand — edit the issues instead; this file is refreshed on every"
            echo "merge to main."
            echo
            echo "## Open"
            echo
            gh issue list --repo "$REPO" --state open \
              --json number,title,url \
              --jq '.[] | "- [ ] [#\(.number)](\(.url)) \(.title)"'
            echo
            echo "## Recently merged PRs"
            echo
            gh pr list --repo "$REPO" --state merged --limit 10 \
              --json number,title,url,mergedAt \
              --jq '.[] | "- [#\(.number)](\(.url)) \(.title) (\(.mergedAt | split("T")[0]))"'
          } > TODO.md

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if ! git diff --quiet -- TODO.md; then
            git add TODO.md
            git commit -m "chore: regenerate TODO.md from open issues"
            git push origin HEAD:main
          else
            echo "TODO.md unchanged"
          fi

name: Update changelog

on:
  pull_request:
    types: [closed]
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: update-changelog
  cancel-in-progress: false

jobs:
  update-changelog:
    # The full per-PR changelog lives on the `dev` branch, not `main` — see
    # CHANGELOG.md on `main` for why. This job keeps `dev` in sync with
    # `main` and refreshes the full changelog there on every merge.
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev
          fetch-depth: 0

      - name: Merge main into dev
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          # CHANGELOG.md / docs/site/CHANGELOG.html intentionally differ
          # between branches (minimal release notes on main, full history on
          # dev) — keep dev's copy on conflict; the next steps regenerate it
          # from scratch anyway.
          #
          # main is the lean release branch and dev is the full tree (see
          # the lean/dev split in project history): main routinely deletes
          # files dev still carries (test/, CLAUDE.md, scripts/*) and
          # renames paths dev hasn't mirrored (examples/graphics ->
          # showcase/). Neither should ever delete or move content on dev.
          # On a flagged conflict (content, modify/delete, or
          # rename/location) keep dev's side; a file main deletes that dev
          # hasn't touched merges *without* a conflict (git just deletes
          # it), so afterwards also restore anything that disappeared
          # compared to dev's pre-merge tree.
          PRE_MERGE=$(git rev-parse HEAD)
          if ! git merge --no-edit -X ours origin/main; then
            git diff --name-only --diff-filter=U | xargs -r git add
            git commit --no-edit
          fi
          DELETED=$(git diff --name-only --diff-filter=D "$PRE_MERGE" HEAD)
          if [ -n "$DELETED" ]; then
            echo "$DELETED" | while IFS= read -r f; do git checkout "$PRE_MERGE" -- "$f"; done
            git add -A
            git commit --amend --no-edit
          fi

      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Regenerate CHANGELOG.md from merged PRs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/update_changelog.py

      - name: Rebuild HTML docs
        run: python scripts/build_user_docs.py

      - name: Commit and push if changed
        run: |
          git add -A
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "chore: sync dev with main + refresh changelog (PR #${{ github.event.pull_request.number }})"
            git push origin HEAD:dev
          fi
